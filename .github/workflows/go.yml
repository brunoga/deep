name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -v ./...

      # The proto companion is its own module (its dependency on
      # google.golang.org/protobuf must not reach the core), so ./... from the
      # root does not touch it.
      - name: Build proto module
        run: go build -v ./...
        working-directory: proto

      - name: Vet proto module
        run: go vet ./...
        working-directory: proto

      - name: Test proto module
        run: go test -race -v ./...
        working-directory: proto
