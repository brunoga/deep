name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -v ./...

      # Short fuzz passes on every run: the property suite and fuzzers have
      # found more real defects in this repository than any other kind of
      # test, including a remotely triggerable OOM the day the decoder became
      # network-facing. Fifteen seconds per target keeps CI fast while still
      # searching beyond the seeds.
      - name: Fuzz diff round trip
        run: go test -run=XXX -fuzz=FuzzDiffApply -fuzztime=15s .

      - name: Fuzz binary update decoder
        run: go test -run=XXX -fuzz=FuzzUpdateUnmarshalBinary -fuzztime=15s ./crdt

      - name: Fuzz binary state-vector decoder
        run: go test -run=XXX -fuzz=FuzzStateVectorUnmarshalBinary -fuzztime=15s ./crdt

      # The proto companion is its own module (its dependency on
      # google.golang.org/protobuf must not reach the core), so ./... from the
      # root does not touch it.
      - name: Build proto module
        run: go build -v ./...
        working-directory: proto

      - name: Vet proto module
        run: go vet ./...
        working-directory: proto

      - name: Test proto module
        run: go test -race -v ./...
        working-directory: proto

      - name: Fuzz proto applier
        run: go test -run=XXX -fuzz=FuzzApplyToMessage -fuzztime=15s .
        working-directory: proto

      - name: Fuzz proto resolver
        run: go test -run=XXX -fuzz=FuzzResolveInMessage -fuzztime=15s .
        working-directory: proto

      - name: Build ws module
        run: go build -v ./...
        working-directory: ws

      - name: Vet ws module
        run: go vet ./...
        working-directory: ws

      - name: Test ws module
        run: go test -race -v ./...
        working-directory: ws

      # The incident example is a complete application spanning all three
      # modules; building and testing it is the proof that the library's
      # pieces still compose.
      - name: Build incident example
        run: go build -v ./...
        working-directory: examples/incident

      - name: Vet incident example
        run: go vet ./...
        working-directory: examples/incident

      - name: Test incident example
        run: go test -race -v ./...
        working-directory: examples/incident

      - name: Build arena example
        run: go build -v ./...
        working-directory: examples/arena

      - name: Vet arena example
        run: go vet ./...
        working-directory: examples/arena

      - name: Test arena example
        run: go test -race -v ./...
        working-directory: examples/arena

      - name: Build fieldwork example
        run: go build -v ./...
        working-directory: examples/fieldwork

      - name: Vet fieldwork example
        run: go vet ./...
        working-directory: examples/fieldwork

      - name: Test fieldwork example
        run: go test -race -v ./...
        working-directory: examples/fieldwork
